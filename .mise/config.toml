[tools]
actionlint = "1.7.12"
go = "1.27.3"
golangci-lint = "2.15.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "v1.9.0"
lefthook = "2.2.2"
oxfmt = "0.74.0"
yq = "4.54.1"
syft = "1.55.0"
zizmor = "1.31.1"

[tasks.build]
description = "Build the binary"
run = "go build ./..."

[tasks.fmt]
description = "Run go fmt against code"
run = "go fmt ./..."

[tasks.vet]
description = "Run go vet against code"
run = "go vet ./..."

[tasks.vulncheck]
description = "Scan for known vulnerabilities with govulncheck"
run = "govulncheck ./..."

[tasks.test]
description = "Run tests with coverage"
run = "go test -race $(go list ./...) -coverprofile cover.out"

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run"

[tasks.lint-fix]
description = "Run golangci-lint with --fix"
run = "golangci-lint run --fix"

[hooks]
postinstall = "lefthook install"
