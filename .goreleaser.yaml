---
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2
project_name: tplink-plug-exporter

before:
  hooks:
    - go mod tidy

builds:
  - id: tplink-plug-exporter
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}} -X main.commit={{.Commit}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    main: ./cmd/tplink-plug-exporter
    binary: tplink-plug-exporter

archives:
  - id: tplink-plug-exporter
    ids:
      - tplink-plug-exporter
    format_overrides:
      - goos: windows
        formats:
          - zip

upx:
  - enabled: true
    compress: best
    lzma: true

checksum:
  algorithm: sha256
  split: true

sboms:
  - artifacts: archive
    documents:
      - "{{ .ArtifactName }}.sbom.json"

signs:
  - cmd: cosign
    signature: ${artifact}.sigstore.json
    args:
      - sign-blob
      - --bundle=${signature}
      - --yes
      - ${artifact}
    artifacts: all
    output: true

# release-please creates the GitHub Release with the changelog; goreleaser
# attaches binaries/sboms/sigs to it.
release:
  mode: keep-existing
